[build]
target = "x86_64-unknown-none"

[target.x86_64-unknown-none]
rustflags = [
    "-C", "link-arg=-Tlinker/linker.ld",
    "-C", "panic=abort",
    "-C", "target-feature=+crt0",
]

# Runner 配置：隐藏 QEMU 启动逻辑
# 我们使用 shell 命令来模拟 run-qemu.sh 的行为：创建临时 ESP 并启动 QEMU
runner = "bash -c 'mkdir -p /tmp/paranukos_esp/EFI/BOOT; cp target/x86_64-unknown-none/debug/paranukos.efi /tmp/paranukos_esp/EFI/BOOT/BOOTX64.EFI && qemu-system-x86_64 -bios /usr/share/edk2/ovmf/OVMF_CODE.fd -net none -nographic -drive format=raw,file=fat:rw:/tmp/paranukos_esp'"
