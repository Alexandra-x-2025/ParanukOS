[package]
name = "kernel-memory"
version = "0.1.0"
edition = "2024"
description = "ParanukOS 内核内存子系统：UEFI 内存图解析、页表构建、页帧分配、内核堆"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
# 有意保持零依赖：既要能被 no_std 的内核链接，又要在宿主平台上直接跑单元测试
# （内核二进制必须 test = false，原因见根 Cargo.toml 的 [[bin]] 注释）。
# 审计依据：AGENTS.md 第 2 条禁止任何隐式引入 std 的依赖，零依赖是最强的保证。

[features]
# 仅用于测试：让页帧分配器**不**把已发放的页帧标记为已占用，于是同一个页帧会被发出两次。
# 内核的 `inject-memory-fault` 特性转发到它，用来验证自检能发现"重复分配"这一最危险的
# bug 类型并以退出码 43 结束。生产构建绝不启用。
inject-double-alloc = []
